<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9dots_Contact</title>
    <style>
        *{
            box-sizing: border-box;
            font-family: 'Lucida Sans', Verdana, sans-serif;
            margin: 0px;
            padding: 0px;
        }

        body{
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            background-color: #e9f8b1;
        }

        .login_container{
            width: 450px;
            border: 2px solid #1494a5;
            padding: 40px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: .4px .2px 8px 0.1px #66666696;
        }

        h2{
            color: #071355;
            text-align: center;
            margin-bottom: 21px;
            font-weight: bolder;
            font-size: xx-large;
        }
        
        label{
            color: #071a81;
            display: block;
            font-size: 18px;
            margin-bottom: 5px;
        }

        input{
            width: 100%;
            padding: 13px;
            border-radius: 5px;
            border: 1px solid #1494a5;
        }

        /* input:focus{
            border-color:#86a514;
        } */

        .input_group{
            margin-bottom: 13px;
        }

        button{
            width: 100%;
            padding: 12px;
            font-size: 17px;
            border-radius: 5px;
            font-weight: bolder;
            border: 1px solid #1494a5;
            background-color: #071355;
            /* background-color: #e9f8b1; */
            color: #e9f8b1;
        }
        
        button:hover{
            background: linear-gradient(to bottom, #051780, #0a70c4);
            transition: 3s;
            color: #fff;
            /* transform: rotate(360deg); */
        }
        
        textarea{
            border: 1px solid #1494a5;
            width: 100%;
            height: 80px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div>
        <h1 style="text-align: center; padding: 19px; color: #071355; font-weight: bolder; font-size: 39px; text-decoration: underline;">9dots Power House</h1>
        <div class="login_container">
            <h2 id="contact us">Contact Us</h2>
            <form>
                <div class="input_group">
                    <label for="Firstname">First Name</label>
                    <input type="text" placeholder="Enter Firstname" required>
                </div>
                <div class="input_group">
                    <label for="Lastname">Last Name</label>
                    <input type="text" placeholder="Enter Lastname" required>
                </div>
                <div class="input_group">
                    <label for="email">Email Address</label>
                    <input type="email" placeholder="Enter Email Address" required>
                </div>
                <div class="input_group">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" placeholder="Leave us a message..."></textarea>
                </div>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
